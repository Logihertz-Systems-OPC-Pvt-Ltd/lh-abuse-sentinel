[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-abuse-sentinel"
version = "0.1.0"
description = "Audits API gateway rate-limiting manifests, Nginx throttling zones, Redis sliding-window counters, and request velocity logs to detect missing brute-force defense, spoofable rate keys, and credential-stuffing abuse."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
keywords = [
    "rate-limiting",
    "brute-force-protection",
    "api-security",
    "bot-mitigation",
    "sarif",
    "python-security",
    "logihertz",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.8",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-abuse-sentinel"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-abuse-sentinel"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-abuse-sentinel#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-abuse-sentinel/issues"

[project.scripts]
lh-abuse = "lh_abuse_sentinel.cli:app"
lh-abuse-sentinel = "lh_abuse_sentinel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_abuse_sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

